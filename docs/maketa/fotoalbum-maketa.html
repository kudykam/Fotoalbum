<title>Fotoalbum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: okno aplikace se třemi obrazovkami – Knihovna (mřížka alb), Pracovna (strom | fotka | panel s popiskem), Čtení (dvoustrana alba). Přepínač náhledu PC / tablet 1280×800. */
:root{
  --page:#dce3df; --win:#f5f7f5; --side:#e8eee9; --surface:#ffffff; --ink:#17201c; --muted:#52615a;
  --line:#c9d3cd; --accent:#2b684b; --accent-ink:#ffffff; --accent-soft:#d9eadf;
  --rec:#c22a2a; --rec-ink:#ffffff; --rec-soft:#fbe2df; --warn:#8d5a0f; --warn-soft:#f6e8cf;
  --skip:#8f9a94; --stage:#0f1411; --focus:#1d5fc4; --shadow:0 18px 50px rgba(20,40,30,.18);
  --paper:#fbfbf8; --paper-ink:#23211d; --paper-muted:#6f6a60; --desk:#3a4540; --bezel:#151917;
  --ui:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --text:'Literata',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0a0e0c; --win:#141a17; --side:#101512; --surface:#1b231f; --ink:#e6eee9; --muted:#9db0a5;
  --line:#2b3631; --accent:#74c59a; --accent-ink:#0b1810; --accent-soft:#1e392b;
  --rec:#ff716a; --rec-ink:#2a0c0a; --rec-soft:#3b1c1a; --warn:#e6b25e; --warn-soft:#3a2c15;
  --skip:#6d7a73; --stage:#060807; --focus:#86b4ff; --shadow:0 18px 50px rgba(0,0,0,.5);
  --paper:#24231f; --paper-ink:#efebe2; --paper-muted:#aaa392; --desk:#0d110f; --bezel:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0a0e0c; --win:#141a17; --side:#101512; --surface:#1b231f; --ink:#e6eee9; --muted:#9db0a5;
  --line:#2b3631; --accent:#74c59a; --accent-ink:#0b1810; --accent-soft:#1e392b;
  --rec:#ff716a; --rec-ink:#2a0c0a; --rec-soft:#3b1c1a; --warn:#e6b25e; --warn-soft:#3a2c15;
  --skip:#6d7a73; --stage:#060807; --focus:#86b4ff; --shadow:0 18px 50px rgba(0,0,0,.5);
  --paper:#24231f; --paper-ink:#efebe2; --paper-muted:#aaa392; --desk:#0d110f; --bezel:#000; color-scheme:dark}

html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.4}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.wrap{height:100%;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{height:100%}
.app{position:relative;height:100%;max-width:2200px;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr);
  background:var(--win);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}

/* tablet náhled */
body.tablet .wrap{display:grid;place-items:center;overflow:hidden}
body.tablet .device{width:1312px;height:832px;padding:16px;background:var(--bezel);border-radius:40px;box-shadow:var(--shadow);flex:none}
body.tablet .app{border-radius:14px;border:0;box-shadow:none}
body.tablet .close{display:none}
.conn{display:none;align-items:center;gap:8px;border:1px solid var(--line);background:none;border-radius:99px;padding:7px 14px;cursor:pointer;font-size:15px}
.conn i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
body.tablet .conn{display:flex}
body.tablet .work{grid-template-columns:minmax(0,1fr) 370px}
body.tablet .thumb{width:104px;height:70px}
body.tablet .strip-btn{height:70px}
body.tablet .legend{display:none}
body.tablet .b{min-height:54px}
body.tablet .b.mic{min-height:64px}
body.tablet .b.sm{min-height:44px}
body.tablet .cap{min-height:120px}
body.tablet textarea{min-height:70px}
body.tablet .main{padding:10px 14px 12px}
body.tablet .panel{overflow-y:auto;padding-bottom:2px}
body.tablet .hint{padding:6px 10px;font-size:15px}
body.tablet .hint .b.small{min-height:36px;font-size:15px;padding:4px 10px}
.sleep{position:absolute;inset:0;background:rgba(10,14,12,.72);display:grid;place-items:center;z-index:15;padding:16px}

/* title bar */
.bar{display:flex;align-items:center;gap:20px;padding:8px 10px 8px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.brand{font-weight:700;font-size:19px;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 16px;border-radius:8px;font-size:17px;cursor:pointer;color:var(--muted)}
.tab:hover{background:var(--accent-soft);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.spacer{flex:1}
.close{border:1px solid var(--line);background:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:16px}
.close:hover{background:var(--rec-soft);border-color:var(--rec)}
.demo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--warn);background:var(--warn-soft);padding:4px 18px;border-bottom:1px solid var(--line)}
.demo .spacer{min-width:8px}
.seg{display:flex;align-items:center;gap:3px;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:2px 2px 2px 9px;background:var(--surface);color:var(--muted)}
.seg button{border:0;background:none;border-radius:7px;padding:4px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}

.content{min-height:0;display:grid}
.view{min-height:0;min-width:0}
.body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
.body.nosidebar{grid-template-columns:64px minmax(0,1fr)}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px 18px}
.side-h h2{margin:0;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}
.tree{list-style:none;margin:0;padding:4px 10px;overflow:auto;flex:1}
.tree ul{list-style:none;margin:0;padding-left:22px}
.node{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:10px 10px;border-radius:8px;cursor:pointer;font-size:18px}
.node:hover{background:var(--accent-soft)}
.node[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.node svg{width:22px;height:22px;flex:none}
.node .nm{flex:1;min-width:0}
.node .cnt{font-size:14px;font-variant-numeric:tabular-nums;opacity:.85}
.node .kind{font-size:12px;border:1px solid currentColor;border-radius:99px;padding:0 7px;opacity:.75}
.filters{border-top:1px solid var(--line);padding:12px 14px 16px;display:grid;gap:8px}
.toggle{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:8px;cursor:pointer;font-size:17px}
.toggle input{width:24px;height:24px;accent-color:var(--accent)}
.nosidebar .tree,.nosidebar .filters,.nosidebar .side-h h2{display:none}
.nosidebar .side-h{padding:14px 12px;justify-content:center}

/* pracovna */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px 18px 14px;gap:8px}
.strip-row{display:flex;align-items:center;gap:8px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;flex:1;scroll-behavior:smooth}
.thumb{position:relative;flex:none;width:118px;height:79px;border:3px solid transparent;border-radius:8px;padding:0;background:var(--stage);cursor:pointer;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-current="true"]{border-color:var(--accent)}
.badge{position:absolute;right:4px;top:4px;min-width:24px;height:24px;border-radius:99px;display:grid;place-items:center;font-size:14px;font-weight:700;padding:0 5px}
.badge:empty{display:none}
.badge.done{background:var(--accent);color:var(--accent-ink)}
.badge.draft{background:var(--warn-soft);color:var(--warn)}
.badge.skip{background:var(--skip);color:#fff}
.thumb.skip img{opacity:.55}
.thumb.del img{opacity:.35;filter:grayscale(1)}
.thumb.del{border-color:var(--rec)}
.badge.del{background:var(--rec);color:var(--rec-ink)}
.strip-btn{flex:none;width:44px;height:79px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;display:grid;place-items:center}
.strip-btn svg{width:24px;height:24px}
.track-row{display:flex;align-items:center;gap:12px}
.track{flex:1;height:22px;border-radius:6px;cursor:pointer;display:block;min-width:0;background:var(--side)}
.progress{flex:none;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress b{color:var(--ink);font-size:17px}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,26vw,480px);gap:14px}
.panel{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.stage{position:relative;min-height:220px;background:var(--stage);border-radius:10px;display:grid;place-items:center;overflow:hidden}
.stage canvas{display:block;border-radius:2px;transition:transform .35s ease}
.meta{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;margin-right:12px}
.chip{background:rgba(10,14,12,.72);color:#f2f5f3;border-radius:99px;padding:5px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.chip.every{background:rgba(141,90,15,.9)}
.chip.skipc{background:rgba(90,100,95,.95)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:64px;height:96px;border:0;border-radius:12px;background:rgba(10,14,12,.55);color:#fff;cursor:pointer;display:grid;place-items:center;opacity:.75;transition:opacity .2s}
.nav:hover{opacity:1}
.nav svg{width:36px;height:36px}
.nav.l{left:10px}.nav.r{right:10px}
.nav:disabled{opacity:0;pointer-events:none}
.delmask{position:absolute;inset:0;background:rgba(150,20,20,.45);display:grid;place-items:center}
.box{background:var(--surface);color:var(--ink);border:3px solid var(--rec);border-radius:12px;padding:18px 22px;text-align:center;display:grid;gap:12px;max-width:90%}
.box strong{font-size:20px;color:var(--rec)}
.box.calm{border-color:var(--accent)}
.box.calm strong{color:var(--ink)}
.empty{color:#dfe7e2;text-align:center;padding:30px;display:grid;gap:12px;justify-items:center;font-size:18px}

.hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px}
.hint .q{font-family:var(--text);font-weight:500}
.hint .acts{display:flex;gap:8px;flex-wrap:wrap}

.cap{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:180px}
.cap.rec{border-color:var(--rec)}
.cap.busy textarea{opacity:.4}
.cap-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.mode{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px;padding:3px 9px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.mode.ai{background:var(--accent-soft);color:var(--accent)}
.mode.sk{background:var(--side);color:var(--muted)}
.save{margin-left:auto;display:flex;align-items:center;gap:6px}
.save.ok{color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:2px;font-size:15px}
textarea{width:100%;border:0;resize:none;background:transparent;font-family:var(--text);font-size:21px;line-height:1.5;color:var(--ink);flex:1;min-height:110px;padding:2px 0}
textarea:focus{outline:none}
textarea::placeholder{color:var(--muted);font-style:italic}
.fix{border-top:1px dashed var(--line);padding-top:6px;font-size:17px;display:flex;gap:10px;align-items:baseline}
.fix .lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--rec);flex:none}
.fix .t{font-family:var(--text);color:var(--ink)}
.raw{border-top:1px dashed var(--line);padding-top:6px;font-family:var(--text);color:var(--muted);font-size:16px}
.shimmer{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent-soft),var(--accent),var(--accent-soft));background-size:200% 100%;animation:sh 1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

.btns,.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--line);background:var(--surface);border-radius:12px;min-height:62px;padding:8px 12px;font-size:19px;font-weight:700;cursor:pointer;text-align:center}
.b svg{width:28px;height:28px;flex:none}
.b:hover:not(:disabled){border-color:var(--accent)}
.b:disabled{opacity:.4;cursor:default}
.b.sm{min-height:48px;font-size:17px;font-weight:400}
.b.sm svg{width:22px;height:22px}
.b.mic{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:21px;grid-column:1/-1;order:-2;min-height:76px}
.b.mic.on{background:var(--rec);border-color:var(--rec);color:var(--rec-ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--rec-soft)}}
.b.ai{border-color:var(--accent);color:var(--accent);grid-column:1/-1;order:-1}
.b.small{min-height:42px;font-size:16px;padding:6px 14px;border-radius:9px}
.b.danger{border-color:var(--rec);color:var(--rec)}
.b.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.morewrap{position:relative}
.menu{position:absolute;bottom:calc(100% + 8px);right:0;min-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:grid;z-index:5}
.menu button{display:flex;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:12px 12px;border-radius:8px;font-size:18px;cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
.menu button.danger{color:var(--rec)}
.menu svg{width:22px;height:22px;flex:none}
.menu small{color:var(--muted);font-size:14px;margin-left:auto}

/* knihovna */
.lib{overflow:auto;padding-block:22px 28px}
.lib-in{max-width:1500px;margin:0 auto;padding:0 26px;display:grid;gap:22px}
.resume{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) auto;gap:22px;align-items:center;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:16px}
.resume img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block}
.eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700}
.resume h2{margin:4px 0 6px;font-size:30px;text-wrap:balance;line-height:1.15}
.resume p{margin:0;color:var(--muted);font-size:18px}
.resume .b{min-height:76px;padding:10px 28px;font-size:22px}
.lib-tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lib-tools h2{margin:0 auto 0 0;font-size:24px}
.search{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;min-height:50px;min-width:0;flex:0 1 380px}
.search svg{width:22px;height:22px;color:var(--muted);flex:none}
.search input{border:0;background:none;font-size:18px;flex:1;min-width:0;padding:10px 0}
.search input:focus{outline:none}
.seg.big{font-size:16px;padding:3px 3px 3px 12px;border-radius:12px;min-height:50px}
.seg.big button{font-size:16px;padding:9px 14px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.album{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.album .cover{border:0;padding:0;background:var(--stage);cursor:pointer;display:block;position:relative}
.album .cover img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.album .cover .tag{position:absolute;left:10px;top:10px}
.album .info{padding:14px 16px 16px;display:grid;gap:8px;flex:1}
.album h3{margin:0;font-size:22px;line-height:1.2;text-wrap:balance}
.album .sub{color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums}
.bar3{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--side)}
.bar3 span{display:block;height:100%}
.album .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.results{display:grid;gap:10px}
.res{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;cursor:pointer}
.res img{width:150px;aspect-ratio:3/2;object-fit:cover;border-radius:8px;display:block}
.res .t{font-family:var(--text);font-size:18px}
.res mark{background:var(--warn-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.res .w{color:var(--muted);font-size:15px}

/* čtení */
.read{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--desk);min-height:0}
.read-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.read-tools select{font-size:18px;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);min-height:46px;max-width:100%}
.tvbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:var(--accent);color:var(--accent-ink);padding:8px 16px;font-size:17px}
.tvbar button{border:0;border-radius:8px;padding:6px 12px;background:var(--accent-ink);color:var(--accent);font-weight:700;cursor:pointer}
.stagebook{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:22px 18px;min-height:0}
.book{display:grid;grid-template-columns:1.25fr 1fr;background:var(--paper);color:var(--paper-ink);border-radius:6px;box-shadow:0 25px 60px rgba(0,0,0,.45);max-height:100%;height:100%;min-height:0;overflow:hidden;position:relative}
.book::after{content:"";position:absolute;top:0;bottom:0;left:55.5%;width:36px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.12) 45%,rgba(0,0,0,.18) 50%,rgba(0,0,0,.08) 55%,transparent);pointer-events:none}
.pg{padding:5% 6%;display:flex;flex-direction:column;justify-content:center;min-height:0;min-width:0}
.pg.l{align-items:center}
.pg.l canvas{max-width:100%;max-height:100%;width:100%;height:auto;box-shadow:0 2px 0 rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.18);background:#fff;padding:10px}
.pg.r{gap:18px}
.pg .dt{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted)}
.pg .cp{font-family:var(--text);font-size:clamp(19px,1.5vw,26px);line-height:1.6;margin:0;text-wrap:pretty}
.pg .pl{font-family:var(--text);font-style:italic;color:var(--paper-muted);font-size:17px}
.pg .no{margin-top:auto;font-size:14px;color:var(--paper-muted);font-variant-numeric:tabular-nums;text-align:right}
.pg h2{font-family:var(--text);font-weight:500;font-size:clamp(34px,3vw,52px);line-height:1.1;margin:0;text-wrap:balance}
.pg .intro{font-family:var(--text);font-size:clamp(17px,1.2vw,21px);line-height:1.65;margin:0;color:var(--paper-ink)}
.turn{animation:turn .45s ease}
@keyframes turn{from{opacity:.2;transform:perspective(1600px) rotateY(-8deg)}to{opacity:1;transform:none}}
.bigarrow{width:72px;height:120px;border:0;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center}
.bigarrow:hover:not(:disabled){background:rgba(255,255,255,.22)}
.bigarrow:disabled{opacity:.2;cursor:default}
.bigarrow svg{width:40px;height:40px}
.read-foot{display:flex;justify-content:center;gap:10px;align-items:center;padding:0 16px 16px;color:#d6dfda;font-size:15px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:70%}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:#fff}

/* čtení – varianta fotka přes celou obrazovku */
.read.fullm .stagebook{padding:0;grid-template-columns:minmax(0,1fr);position:relative}
.read.fullm .bigarrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(0,0,0,.35)}
.read.fullm #rPrev{left:16px}.read.fullm #rNext{right:16px}
.read.fullm .bigarrow:disabled{opacity:0}
.read.fullm .read-foot{display:none}
.book.fullmode{display:block;background:#000;border-radius:0;box-shadow:none}
.book.fullmode::after{display:none}
.fullv{position:relative;width:100%;height:100%;background:#000}
.fullv canvas{display:block;width:100%;height:100%;object-fit:contain}
.capbox{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:min(86%,1150px);background:rgba(10,12,11,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#f5f2ea;border-radius:16px;padding:18px 28px 20px;display:grid;gap:8px;border:1px solid rgba(255,255,255,.12)}
.capbox .dt{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#cfc8b8;display:flex;gap:16px}
.capbox .dt span:last-child{margin-left:auto;letter-spacing:0;font-variant-numeric:tabular-nums}
.capbox p{margin:0;font-family:var(--text);font-size:clamp(19px,1.55vw,28px);line-height:1.5;text-wrap:pretty}
.capbox h2{margin:0;font-family:var(--text);font-weight:500;font-size:clamp(30px,2.6vw,46px);line-height:1.1}
.capbox.hide{opacity:0;pointer-events:none}
.capbox{transition:opacity .3s}
.fsx{position:absolute;top:16px;right:16px;z-index:4;border:0;border-radius:10px;background:rgba(0,0,0,.5);color:#fff;padding:10px 16px;font-size:16px;cursor:pointer}
.read:fullscreen{grid-template-rows:0 auto minmax(0,1fr) 0}
.read:fullscreen .read-tools{display:none}

/* toast + modal */
kbd{font-family:var(--ui);font-size:13px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--win);padding:12px 16px 12px 20px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:17px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{border:0;background:var(--win);color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(5,10,8,.55);display:grid;place-items:center;z-index:30;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border-radius:14px;padding:24px;max-width:540px;width:100%;display:grid;gap:14px;box-shadow:var(--shadow)}
.dlg h3{margin:0;font-size:23px;text-wrap:balance}
.dlg p{margin:0;font-size:18px;color:var(--muted)}
.dlg .row{display:grid;gap:10px}
.dev{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:none;cursor:pointer;text-align:left;font-size:18px}
.dev:hover{border-color:var(--accent)}
.dev svg{width:34px;height:34px;flex:none;color:var(--accent)}
.dev small{display:block;color:var(--muted);font-size:15px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:rot 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}

@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  .content{display:block}
  .body,.body.nosidebar{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .tree{max-height:240px}
  .work{display:flex;flex-direction:column}
  .stage{flex:none}
  .devseg,.legend{display:none}
  .nosidebar .side-h{justify-content:flex-start}
  .resume{grid-template-columns:1fr}
  .lib-in{padding:0 4px}
  .res{grid-template-columns:96px minmax(0,1fr)}
  .res img{width:96px}
  .book{grid-template-columns:1fr;height:auto}
  .book::after{display:none}
  .stagebook{grid-template-columns:1fr;padding:14px 0}
  .bigarrow{display:none}
  .read.fullm .book{height:auto}
  .fullv canvas{height:auto;aspect-ratio:3/2}
  .capbox{position:static;transform:none;width:auto;border-radius:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 $("rPos").textContent=R.i<0?"Úvod":`Strana ${R.i+1} z ${pg.length}`;
 $("tvbar").hidden=!R.tv;$("rTv").hidden=R.tv}
function rStep(d){const pg=readPages();const n=R.i+d;if(n<-1||n>=pg.length){if(d>0)stopAuto();return}R.i=n;renderRead()}
function stopAuto(){if(R.auto){clearInterval(R.auto);R.auto=null;$("rAutoT").textContent="Přehrávat samo"}}
$("rAuto").onclick=()=>{if(R.auto){stopAuto();return}R.auto=setInterval(()=>rStep(1),5000);$("rAutoT").textContent="Zastavit přehrávání";toast("Stránka se otočí sama každých 5 sekund.",null,2500)};
$("rPrev").onclick=()=>rStep(-1);$("rNext").onclick=()=>rStep(1);
$("rAlbum").onchange=e=>{R.folder=e.target.value;R.i=-1;stopAuto();renderRead()};
$("rOnly").onchange=e=>{R.only=e.target.checked;R.i=-1;renderRead()};
$("book").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();rStep(e.clientX>r.left+r.width/2?1:-1)};
$("rCap").onclick=()=>{R.capHidden=!R.capHidden;renderRead()};
function setReadMode(m){R.mode=m;try{localStorage.setItem("fa-read",m)}catch(e){}renderRead()}
$("mBook").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});setReadMode("book")};$("mFull").onclick=()=>setReadMode("full");
$("rFs").onclick=()=>{const el=$("vRead");if(el.requestFullscreen)el.requestFullscreen().catch(()=>toast("Celou obrazovku tady prohlížeč nepovolil. V aplikaci to fungovat bude."));else toast("Celou obrazovku tady prohlížeč nepovolil. V aplikaci to fungovat bude.")};
$("fsx").onclick=()=>document.exitFullscreen().catch(()=>{});
document.addEventListener("fullscreenchange",()=>{$("fsx").hidden=!document.fullscreenElement});
$("rTv").onclick=()=>{modal(`<h3>Pustit na televizi</h3><p><span class="spin"></span>Hledám televizi v domácí síti…</p>`,()=>{});
 setTimeout(()=>{modal(`<h3>Pustit na televizi</h3><p>Nalezená zařízení v domácí Wi-Fi:</p><div class="row"><button class="dev" data-a="tv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Samsung UE46F5400<small>Obývák · fotky s popisky posílá počítač</small></span></button>
 ${S.device==="tablet"?'<button class="dev" data-a="mirror"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="11" height="16" rx="2"/><path d="M14 9h7v10h-9"/></svg><span>Zrcadlit obrazovku tabletu<small>Smart View: TV ukáže přesně to, co tablet</small></span></button>':""}
 <button class="b" data-a="no">Zrušit</button></div>`,a=>{if(a==="tv"){R.tv=true;renderRead();toast("Televize ukazuje stejnou stránku jako tady.")}if(a==="mirror")toast("Ukázka: tablet by teď otevřel systémové menu Smart View.")})},1100)};
$("tvStop").onclick=()=>{R.tv=false;renderRead();toast("Promítání na televizi je ukončené.")};

/* ---------- tablet ---------- */
function setDevice(d){S.device=d;document.body.classList.toggle("tablet",d==="tablet");$("dvPC").setAttribute("aria-pressed",d==="pc");$("dvTab").setAttribute("aria-pressed",d==="tablet");
 if(d==="tablet"){S.side=false;$("vWork").classList.add("nosidebar")}else{S.asleep=false;$("sleep").hidden=true}
 fitDevice();renderSave();setTimeout(()=>{fitCanvas();drawTrack()},50)}
function fitDevice(){const dv=$("device");if(S.device!=="tablet"){dv.style.zoom="";return}const k=Math.min((innerWidth-32)/1312,(innerHeight-28)/832,1);dv.style.zoom=k}
addEventListener("resize",()=>{fitDevice();drawTrack()});
$("dvPC").onclick=()=>setDevice("pc");$("dvTab").onclick=()=>setDevice("tablet");
$("conn").onclick=()=>{S.asleep=true;stopRec();sleepView()};
function sleepView(){const s=$("sleep");s.hidden=false;s.innerHTML=`<div class="box calm"><strong style="font-size:24px">Počítač spí</strong><span style="font-size:18px">Fotky jsou uložené v počítači. Aby šlo pokračovat, musí být zapnutý.</span><button class="b solid" id="wake">Probudit počítač</button><span style="color:var(--muted);font-size:14px">Ukázka: klepnutím na „Připojeno k počítači“ nahoře se dá stav spánku vyzkoušet znovu.</span></div>`;
 $("connT").textContent="Počítač spí";$("conn").querySelector("i").style.background="var(--skip)";
 $("wake").onclick=()=>{s.innerHTML=`<div class="box calm"><strong style="font-size:22px"><span class="spin"></span>Probouzím počítač…</strong><span>Obvykle to trvá do půl minuty.</span></div>`;setTimeout(()=>{s.hidden=true;S.asleep=false;$("connT").textContent="Připojeno k počítači";$("conn").querySelector("i").style.background="";toast("Počítač je vzhůru, můžete pokračovat.")},2200)}}

/* ---------- toast, modal, zavření ---------- */
let toastT;function toast(msg,act,ms){const h=$("toastHost");h.innerHTML=`<div class="toast" role="status"><span>${msg}</span>${act?`<button>${act.label}</button>`:""}</div>`;if(act)h.querySelector("button").onclick=()=>{h.innerHTML="";act.fn()};clearTimeout(toastT);toastT=setTimeout(()=>h.innerHTML="",ms||5000)}
function modal(html,cb){const h=$("modalHost");h.innerHTML=`<div class="modal"><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`;const first=h.querySelector("[data-a]");if(first)first.focus();
 h.querySelector(".modal").onclick=e=>{const b=e.target.closest("[data-a]");if(!b&&e.target.classList.contains("modal")){h.innerHTML="";cb("no");return}if(b){h.innerHTML="";cb(b.dataset.a)}}}
function closeProgram(){stopRec();flushSave();const dels=albums.flatMap(f=>f.photos).filter(p=>p.del);
 const done=()=>modal(`<h3>Program je zavřený</h3><p>V ukázce ho můžete hned otevřít znovu.</p><div class="row"><button class="b solid" data-a="ok">Otevřít Fotoalbum</button></div>`,()=>show("lib"));
 if(!dels.length){done();return}
 modal(`<h3>Označeno ${dels.length} ${dels.length===1?"fotka":dels.length<5?"fotky":"fotek"} ke smazání</h3><p>${dels.map(p=>p.file).join(", ")}</p><p>Fotky se přesunou do koše Windows. Odtud je jde ještě obnovit.</p><div class="row"><button class="b danger" data-a="bin">Přesunout do koše a zavřít</button><button class="b" data-a="keep">Ponechat fotky a zavřít</button><button class="b" data-a="no">Zpět do programu</button></div>`,
 a=>{if(a==="no")return;albums.forEach(f=>{if(a==="bin")f.photos=f.photos.filter(p=>!p.del);else f.photos.forEach(p=>p.del=false);if(f.last&&!f.photos.includes(f.last))f.last=null});S.cur=null;stripKey="";done()})}

/* ---------- události ---------- */
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(b.dataset.view==="read"&&S.view==="work"){R.folder=S.folder;R.i=-1}show(b.dataset.view)});
$("prev").onclick=$("pL").onclick=()=>step(-1);$("next").onclick=$("pR").onclick=()=>step(1);$("mic").onclick=toggleRec;$("ai").onclick=improve;$("nextUndone").onclick=nextUndone;
$("undo").onclick=()=>{const p=S.cur;if(p&&p.hi>0){p.hi--;restore(p)}};$("redo").onclick=()=>{const p=S.cur;if(p&&p.hi<p.hist.length-1){p.hi++;restore(p)}};
$("clear").onclick=clearCap;$("more").onclick=e=>{e.stopPropagation();S.menu?closeMenu():openMenu()};
document.addEventListener("click",e=>{if(S.menu&&!e.target.closest(".morewrap"))closeMenu()});
$("closeBtn").onclick=closeProgram;
$("sideBtn").onclick=()=>{S.side=!S.side;$("vWork").classList.toggle("nosidebar",!S.side);$("sideBtn").setAttribute("aria-label",S.side?"Skrýt složky":"Ukázat složky");requestAnimationFrame(()=>{fitCanvas();drawTrack()})};
$("fUndone").onchange=e=>{S.fUndone=e.target.checked;stripKey="";render(true)};$("fEvery").onchange=e=>{S.fEvery=e.target.checked;stripKey="";render(true)};
$("stripL").onclick=()=>$("strip").scrollBy({left:-500});$("stripR").onclick=()=>$("strip").scrollBy({left:500});
let histT;$("ta").addEventListener("input",e=>{const p=S.cur;if(!p)return;p.text=e.target.value;if(p.text.trim())p.skip=false;touch();renderStrip();renderButtons();clearTimeout(histT);histT=setTimeout(()=>{pushHist(p);renderTree();renderButtons()},800)});
document.addEventListener("keydown",e=>{if($("modalHost").innerHTML)return;if(e.key==="Escape"){closeMenu();return}
 const typing=/TEXTAREA|INPUT|SELECT/.test(e.target.tagName);
 if(S.view==="read"&&!typing){if(e.key==="ArrowLeft"){e.preventDefault();rStep(-1)}if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();rStep(1)}return}
 if(S.view!=="work")return;if(e.key==="F2"){e.preventDefault();toggleRec();return}if(typing)return;
 if(e.key==="ArrowLeft"){e.preventDefault();step(-1)}else if(e.key==="ArrowRight"){e.preventDefault();step(1)}
 else if(e.key==="b"||e.key==="B"){toggleSkip()}
 else if(e.key===" "&&!e.target.closest("button,input")){e.preventDefault();toggleRec()}});
new ResizeObserver(()=>{fitCanvas();drawTrack()}).observe($("stage"));
show("lib");
</script>
