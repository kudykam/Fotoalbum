name: Sestavení a testy

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Novější běh na stejné větvi zruší starší, který ještě běží.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    name: Testy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: ExifTool (z oficiálního repozitáře, nezávisle na zrcadlech Ubuntu)
        timeout-minutes: 5
        run: |
          git clone --depth 1 https://github.com/exiftool/exiftool.git "$RUNNER_TEMP/exiftool"
          echo "$RUNNER_TEMP/exiftool" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/exiftool/exiftool" -ver
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  windows:
    name: Aplikace pro Windows
    runs-on: windows-latest
    needs: testy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Sestavení (samostatná aplikace, není potřeba instalovat .NET)
        run: dotnet publish src/Fotoalbum.Desktop -c Release -r win-x64 --self-contained -o out/Fotoalbum
      - name: Přibalit ExifTool (aktuální verze z exiftool.org)
        shell: pwsh
        run: |
          # Název balíčku se zjistí přímo z hlavní stránky (mění se s verzí); záložně SourceForge.
          $page = (Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 4 -RetryIntervalSec 15 https://exiftool.org/).Content
          $zip = [regex]::Match($page, 'exiftool-[0-9.]+_64\.zip').Value
          if (-not $zip) { throw "Na exiftool.org nebyl nalezen balíček pro Windows." }
          Write-Host "ExifTool: $zip"
          try {
            Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 3 -RetryIntervalSec 15 "https://exiftool.org/$zip" -OutFile exiftool.zip
          } catch {
            Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 3 -RetryIntervalSec 15 -UserAgent "Wget" "https://sourceforge.net/projects/exiftool/files/$zip/download" -OutFile exiftool.zip
          }
          Expand-Archive exiftool.zip -DestinationPath exiftool-tmp
          $exe = Get-ChildItem exiftool-tmp -Recurse -Filter "exiftool*.exe" | Select-Object -First 1
          if (-not $exe) { throw "V balíčku ExifToolu chybí exiftool.exe." }
          New-Item -ItemType Directory -Force out/Fotoalbum/exiftool | Out-Null
          Copy-Item -Recurse "$($exe.DirectoryName)/*" out/Fotoalbum/exiftool/
          if ($exe.Name -ne "exiftool.exe") { Rename-Item "out/Fotoalbum/exiftool/$($exe.Name)" exiftool.exe }
          & out/Fotoalbum/exiftool/exiftool.exe -ver
      - uses: actions/upload-artifact@v5
        with:
          name: Fotoalbum-win-x64
          path: out/Fotoalbum
          retention-days: 30
