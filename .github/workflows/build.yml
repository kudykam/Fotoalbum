name: Sestavení a testy

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Novější běh na stejné větvi zruší starší, který ještě běží.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    name: Testy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: ExifTool (z oficiálního repozitáře, nezávisle na zrcadlech Ubuntu)
        timeout-minutes: 5
        run: |
          git clone --depth 1 https://github.com/exiftool/exiftool.git "$RUNNER_TEMP/exiftool"
          echo "$RUNNER_TEMP/exiftool" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/exiftool/exiftool" -ver
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  windows:
    name: Aplikace pro Windows
    runs-on: windows-latest
    needs: testy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Sestavení (samostatná aplikace, není potřeba instalovat .NET)
        run: dotnet publish src/Fotoalbum.Desktop -c Release -r win-x64 --self-contained -o out/Fotoalbum
      - name: Přibalit ExifTool (aktuální verze z exiftool.org)
        shell: pwsh
        run: |
          $v = (Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 4 -RetryIntervalSec 15 https://exiftool.org/ver.txt).Content.Trim()
          Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 4 -RetryIntervalSec 15 "https://exiftool.org/exiftool-${v}_64.zip" -OutFile exiftool.zip
          Expand-Archive exiftool.zip -DestinationPath exiftool-tmp
          $dir = Get-ChildItem exiftool-tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force out/Fotoalbum/exiftool | Out-Null
          Copy-Item -Recurse "$($dir.FullName)/*" out/Fotoalbum/exiftool/
          Rename-Item "out/Fotoalbum/exiftool/exiftool(-k).exe" exiftool.exe
          & out/Fotoalbum/exiftool/exiftool.exe -ver
      - uses: actions/upload-artifact@v5
        with:
          name: Fotoalbum-win-x64
          path: out/Fotoalbum
          retention-days: 30
