<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fotoalbum</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand"><img src="icon.svg" alt="" width="30" height="30">Fotoalbum</div>
    <span class="screen">Pracovna</span>
    <span class="ver" id="ver"></span>
    <span class="upd" id="upd" hidden></span>
    <div class="spacer"></div>
    <span class="pending" id="pending" hidden></span>
    <button class="close" id="closeBtn">Zavřít program</button>
  </header>

  <div class="content">
    <!-- první spuštění / nastavení -->
    <section class="setup" id="setup" hidden></section>

    <!-- Pracovna -->
    <div class="body" id="work" hidden>
      <aside class="side">
        <div class="side-h"><h2>Složky s fotkami</h2><button class="icon-btn" id="sideBtn" aria-label="Skrýt složky" title="Skrýt / ukázat složky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button></div>
        <ul class="tree" id="tree"></ul>
        <div class="filters">
          <div class="kindrow" id="kindRow"></div>
          <label class="toggle"><input type="checkbox" id="fUndone"> Jen nevyřízené fotky</label>
          <label class="toggle"><input type="checkbox" id="fVac"> Ukázat jen dovolené</label>
        </div>
      </aside>
      <main class="main">
        <div class="strip-row">
          <button class="strip-btn" id="stripL" aria-label="Posunout miniatury doleva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div class="strip" id="strip" role="list"></div>
          <button class="strip-btn" id="stripR" aria-label="Posunout miniatury doprava"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <div class="track-row">
          <div class="progress" id="progress"></div>
          <canvas class="track" id="track" height="22" aria-label="Postup ve složce – klepnutím skočíte na místo"></canvas>
          <button class="b small" id="nextUndone">Další nepopsaná <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg></button>
        </div>
        <div class="work">
          <div class="stage" id="stage">
            <img id="photo" alt="">
            <div class="meta" id="meta"></div>
            <div class="loading" id="loading" hidden><span class="spin"></span>Načítám složku…</div>
            <button class="nav l" id="pL" aria-label="Předchozí fotka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button class="nav r" id="pR" aria-label="Další fotka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
          <div class="panel">
            <section class="cap" id="cap">
              <div class="cap-h"><span class="mode" id="mode"></span><span class="save" id="save"></span>
                <button class="capbtn" id="clear" title="Smazat celý popisek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Smazat text</button></div>
              <textarea id="ta" rows="3" placeholder="Napište, co je na fotce. Ukládá se samo."></textarea>
              <div class="warn" id="writeErr" hidden></div>
            </section>
            <div class="btns">
              <button class="b" id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg>Předchozí</button>
              <button class="b" id="next">Další<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button>
            </div>
            <button class="b skipbtn" id="skip" title="Fotka nepotřebuje popisek – přejde se na další (klávesa B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>Bez popisku – další fotka</button>
            <div class="btns3">
              <button class="b sm" id="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>Zpět</button>
              <button class="b sm" id="redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg>Znovu</button>
              <div class="morewrap"><button class="b sm" id="more" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>Více</button><div class="menu" id="menu" hidden></div></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
<div id="toastHost"></div>
<div id="modalHost"></div>
<script src="app.js"></script>
</body>
</html>
