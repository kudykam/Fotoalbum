<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fotokronika</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand"><img src="icon.svg" alt="" width="30" height="30">Fotokronika</div>
    <div class="work-actions" id="workActions" hidden>
      <button class="b sm" id="undo" title="Zpět (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg><span class="t">Zpět</span></button>
      <button class="b sm" id="redo" title="Znovu (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg><span class="t">Znovu</span></button>
      <div class="morewrap"><button class="b sm" id="more" title="Více" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span class="t">Více</span></button><div class="menu" id="menu" hidden></div></div>
    </div>
    <nav class="view-tabs" id="viewTabs" aria-label="Obrazovky" hidden>
      <button type="button" id="workView" aria-current="page">Pracovna</button>
      <button type="button" id="libraryView">Knihovna</button>
      <button type="button" id="readingView">Čtení</button>
    </nav>
    <div class="search" id="albumSearch" hidden>
      <input id="searchQuery" type="search" maxlength="500" placeholder="Hledat alba a fotky" aria-label="Hledat alba a fotky">
      <button class="b small" id="searchMic" type="button" title="Diktovat hledání" aria-label="Diktovat hledání">🎤</button>
      <button class="b small" id="searchClear" type="button" title="Zrušit hledání" aria-label="Zrušit hledání">✕</button>
    </div>
    <div class="spacer"></div>
    <span class="pending" id="pending" hidden></span>
    <span class="ver" id="ver"></span>
    <span class="upd" id="upd" hidden></span>
    <button class="gear" id="gearBtn" title="Nastavení (pro správce)" aria-label="Nastavení"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
    <button class="close" id="closeBtn">Zavřít program</button>
  </header>

  <div class="content">
    <!-- první spuštění / nastavení -->
    <section class="setup" id="setup" hidden></section>

    <!-- Pracovna -->
    <div class="body" id="work" hidden>
      <aside class="side" id="folderPanel">
        <div class="side-h"><h2>Složky s fotkami</h2><button class="icon-btn" id="sideBtn" aria-label="Skrýt složky" title="Skrýt / ukázat složky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button></div>
        <ul class="tree" id="tree"></ul>
        <div class="filters">
          <div class="kindrow" id="kindRow"></div>
          <label class="toggle"><input type="checkbox" id="fUndone"> Jen nevyřízené fotky</label>
          <label class="toggle"><input type="checkbox" id="fVac"> Ukázat jen dovolené</label>
        </div>
      </aside>
      <div class="splitter" id="folderGrip" role="separator" aria-label="Šířka složek" aria-orientation="vertical" aria-controls="folderPanel" tabindex="0"></div>
      <main class="main" id="workspace">
          <nav class="crumbs" id="crumbs" aria-label="Cesta ke složce" hidden></nav>
          <div class="stage" id="stage">
            <img id="photo" alt="">
            <div class="meta" id="meta"></div>
            <div class="state" id="state"></div>
            <div class="loading" id="loading" hidden><span class="spin"></span>Načítám složku…</div>
            <button class="nav l" id="pL" aria-label="Předchozí fotka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button class="nav r" id="pR" aria-label="Další fotka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
          <section class="cap" id="cap">
            <div class="cap-h"><span class="mode" id="mode"></span><span class="recbar" id="recbar" hidden></span><span class="save" id="save"></span>
              <button class="linkbtn" id="rawBtn" hidden>Původní text</button>
              <button class="capbtn" id="clear" title="Smazat celý popisek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Smazat text</button></div>
            <div class="cap-body">
              <div id="busyBar" hidden class="shimmer"></div>
              <textarea id="ta" placeholder="Napište, co je na fotce."></textarea>
              <div class="rawbox" id="rawBox" hidden><div class="rawtxt" id="rawTxt"></div><button class="b small" id="useRaw">Vrátit původní text do pole</button></div>
              <div class="fix" id="fix" hidden><span class="lbl">Pokyn k úpravě</span><span class="t" id="fixT"></span></div>
              <div class="warn" id="writeErr" hidden></div>
            </div>
            <div class="foot">
              <button class="b" id="prev" title="Předchozí fotka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg><span class="t">Předchozí</span></button>
              <button class="b" id="next" title="Další fotka"><span class="t">Další</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button>
              <button class="b skipbtn" id="skip" title="Fotka nepotřebuje popisek – přejde se na další (klávesa B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>Bez popisku – další fotka</button>
            </div>
            <div class="acts">
              <div class="aibtns" id="aiRow" hidden>
                <button class="b mic" id="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg><span id="micT">Diktovat</span></button>
                <button class="b ai" id="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span id="aiT">Korektura</span></button>
              </div>
              <button class="b okbtn" id="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg><span id="okT">Schválit a další fotka</span></button>
              <div class="hint" id="hint">Text můžete kdykoli psát nebo opravovat přímo v poli.</div>
            </div>
          </section>
      </main>
      <main class="library" id="library" hidden></main>
      <div class="splitter" id="thumbGrip" role="separator" aria-label="Šířka miniatur" aria-orientation="vertical" aria-controls="strip" tabindex="0"></div>
      <aside class="rail" id="rail" aria-label="Fotky ve složce">
        <h2 class="rail-folder" id="railFolder"></h2>
        <div class="prog"><div class="progress" id="progress"></div><canvas class="track" id="track" height="14" aria-label="Postup ve složce – klepnutím skočíte na místo"></canvas></div>
        <div class="strip" id="strip" role="list"></div>
        <button class="b small nextu" id="nextUndone">Další nepopsaná <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg></button>
      </aside>
    </div>
  </div>
</div>
<div id="toastHost"></div>
<div id="folderMenu" class="folder-menu" hidden>
  <button type="button" class="b">✓ Označit složku jako hotovou</button>
</div>
<div id="modalHost"></div>
<script src="app.js"></script>
<script src="reading.js"></script>
</body>
</html>
